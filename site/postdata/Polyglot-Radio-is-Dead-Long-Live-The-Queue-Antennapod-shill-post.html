<p>Antennapod is an app for listening to podcasts. It has this “queue”
feature, and it is pretty easy to rack up 10,000 hours of content
through podcast downloads, your own audiobooks, and youtube-dl folders
or whatever else. This is superior to radio. Radio sucks. Come with me
and get in the queue.</p>
