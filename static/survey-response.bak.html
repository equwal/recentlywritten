  <body>
<script>
options = new Array();
options[0] = "<p>You are a bad girl</p>"
options[1] = "<p>Maybe you are a good girl (unlikely)</p>"
options[2] = "<p>You are probably not good enough for Spenser: are you a good girl?</p>"
options[3] = "<p>Spenser might not have time for you</p>"
options[4] = "<p>You are probably a distraction from Spenser's real mission</p>"
options[5] = "<p>It seems like you're not sophisticated enough</p>"

// Check if a choice was already made for this session
let storedChoice = localStorage.getItem('randomChoice');
let RandomNumber;

if (storedChoice === null) {
    // First visit, make a random choice and store it
    RandomNumber = Math.floor(Math.random() * options.length);
    localStorage.setItem('randomChoice', RandomNumber);
} else {
    // Use the stored choice
    RandomNumber = parseInt(storedChoice);
}

document.write(options[RandomNumber]);
</script>
