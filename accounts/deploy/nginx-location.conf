# Example for nginx. Add this block to the server block of recentlywritten.com. nginx
# continues to serve the static site. It sends only /account/ to the
# accounts service.
location /account/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
